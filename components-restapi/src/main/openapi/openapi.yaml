# The static part of the OpenAPI document: what the scan of the web resources cannot figure out
# by itself. The version is filled in by Maven at build time.
openapi: 3.1.0
info:
  title: Silverpeas Applications REST API
  version: ${project.version}
  description: |-
    The REST API of the applications of Silverpeas: the collaborative tools an administrator
    instantiates within a space — publications and folders, media galleries, calendars of events,
    news, communities of users, suggestion boxes, bookable resources, and so on.

    Unless stated otherwise, an endpoint requires the requester to be authenticated. The ways to
    authenticate are described in the security schemes below.
  license:
    name: GNU Affero General Public License v3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
