# Discussion component configuration

# Durations ending in Ms are milliseconds; event durations are minutes.
# Invalid or out-of-range values use the documented default.
# Pagination is bounded by the existing 100-message request safety limit.

# Default: 30; allowed: 1..100.
history.pageSize=30

# Default: 20; allowed: 1..100.
search.pageSize=20

# Default: 30000; allowed: 1000..3600000.
presence.refreshMs=30000

# Default: 1000; allowed: 100..60000.
read.visibilityMs=1000

# Default: 2000; allowed: 100..60000.
read.retryMs=2000

# Default: 2500; allowed: 100..60000.
typing.intervalMs=2500

# Default: 2000; allowed: 100..60000.
typing.throttleMs=2000

# Default: 5000; allowed: 100..60000.
typing.idleMs=5000

# Default: 8000; allowed: 1000..180000.
typing.ttlMs=8000

# Default: 10000; allowed: 100..100000.
typing.maxStates=10000

# Default: 1000; allowed: 100..60000.
live.retryInitialMs=1000

# Default: 30000; allowed: 100..300000.
live.retryMaxMs=30000

# Default: 180; allowed: 1..2000.
pins.excerptLength=180

# Default: 300; allowed: 1..1000.
quote.excerptLength=300

# Default: 60; allowed: 1..10080.
event.durationMinutes=60

# Default: 15; allowed: 0..10080.
event.leadMinutes=15

# Effective typing interval >= server throttle.
# Effective typing TTL >= idle delay + effective interval.
# Effective live retry maximum >= initial retry delay.
